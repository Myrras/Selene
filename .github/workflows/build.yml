name: Build

# Build installable bundles for Windows and macOS.
# - workflow_dispatch: build on demand from the Actions tab.
# - CI's release job dispatches this on the new vX.Y.Z tag; on a tag ref the
#   installers are also attached to that tag's GitHub Release.
#
# Deliberately no `tags` trigger: the release job pushes commit + tag with a
# deploy key, which does fire workflows. The commit carries [skip ci], but
# GitHub's docs don't say whether that also suppresses the tag push, so a tag
# trigger could mean zero or two builds per release. The explicit dispatch is
# exactly one. A hand-pushed tag builds with `gh workflow run build.yml --ref vX.Y.Z`.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest # WebView2 Evergreen runtime is preinstalled
          - os: macos-latest # Apple Silicon -> aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # Cargo workspace root (target/ lives here, not under src-tauri/).
          workspaces: .
          key: ${{ matrix.os }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Runs beforeBuildCommand (pnpm build = tsc && vite build), then bundles
      # for the host OS. Output lands under target/release/bundle/ (workspace root).
      - name: Build app
        run: pnpm tauri build

      - name: Upload bundles
        uses: actions/upload-artifact@v6
        with:
          name: selene-${{ matrix.os }}
          # Cargo workspace: target/ is at the repo root, not under src-tauri/.
          # upload-artifact's glob has no brace expansion; list patterns instead.
          # Windows ships only the NSIS .exe (MSI is disabled in
          # tauri.windows.conf.json); macOS ships the .dmg.
          path: |
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.dmg
          if-no-files-found: error

      - name: Attach installers to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(target/release/bundle/nsis/*.exe target/release/bundle/dmg/*.dmg)
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
