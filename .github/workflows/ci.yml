name: CI

# Test + lint pipeline. Runs on every pull request and on pushes to main, so
# regressions are caught before merge/release. (Bundle building lives in
# build.yml.)
#
# Releases: every push to main (a merged PR) is a release. The `release` job
# turns CHANGELOG.md's `## [Unreleased]` section into the next version (patch,
# or minor/major via a PR label), bumps the manifests, commits `Release vX.Y.Z`
# to main, tags it, creates the GitHub Release and dispatches build.yml, which
# attaches the installers. The `changelog` job makes every PR add that entry.
#
# The release push goes over SSH with a write-enabled deploy key (secret
# RELEASE_DEPLOY_KEY): main's ruleset only lets admins and deploy keys bypass
# its PR rule, and GitHub refuses the Actions app as a bypass actor on a
# user-owned repo, so a GITHUB_TOKEN push is rejected with GH013. Unlike a
# GITHUB_TOKEN push, a deploy-key push does trigger workflows; `[skip ci]` in
# the release commit stops that from re-running CI on main.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR cancels the previous, still-running run. Never
# cancel on main: a cancelled run would leave a merge without a version.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: the pipeline only reads the repo.
permissions:
  contents: read

jobs:
  changelog:
    name: Changelog
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Release script tests
        run: |
          bash scripts/next-version.test.sh
          bash scripts/changelog.test.sh

      - name: PR adds a CHANGELOG entry
        run: |
          if ! git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx CHANGELOG.md \
            || ! bash scripts/changelog.sh unreleased >/dev/null; then
            echo "::error file=CHANGELOG.md::Add an entry for this change under '## [Unreleased]' in CHANGELOG.md (Keep a Changelog headings, user-facing voice). Merging to main releases it."
            exit 1
          fi

  release:
    name: Release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [frontend, rust]
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Without the key, checkout falls back to GITHUB_TOKEN and the push dies
      # on main's ruleset with an opaque GH013; fail here with the fix instead.
      - name: Deploy key configured?
        env:
          HAS_KEY: ${{ secrets.RELEASE_DEPLOY_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error title=RELEASE_DEPLOY_KEY missing::The release push needs a deploy key. Run: ssh-keygen -t ed25519 -N '' -C selene-release -f selene-release; gh repo deploy-key add selene-release.pub --allow-write --title 'release (CI)'; gh secret set RELEASE_DEPLOY_KEY < selene-release; then delete both key files and re-run this job. main's ruleset must list DeployKey as a bypass actor."
            exit 1
          fi

      # main, not the pushed sha: a queued second run must see the first run's
      # release commit, or it would release the same version twice. The deploy
      # key makes `git push` go over SSH (see the header comment).
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      # An empty Unreleased section means an earlier run already released this.
      - name: Anything to release?
        id: pending
        run: |
          if bash scripts/changelog.sh unreleased > "$RUNNER_TEMP/notes.md"; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing under ## [Unreleased]; already released."
          fi

      - name: Determine version
        if: steps.pending.outputs.release == 'true'
        run: |
          prev=$(git describe --tags --match 'v[0-9]*' --abbrev=0)
          labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[0].labels[]?.name] | join(",")')
          tag=$(bash scripts/next-version.sh "$prev" "$labels")
          echo "$prev → $tag (labels: ${labels:-none})"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"

      - name: Bump CHANGELOG, manifests and Cargo.lock
        if: steps.pending.outputs.release == 'true'
        run: |
          bash scripts/changelog.sh release "$VERSION" "$(date -u +%F)"
          bash scripts/sync-version.sh --set "$VERSION"
          cargo update --workspace
          bash scripts/sync-version.sh --check
          git diff --stat

      - name: Commit, tag and push
        if: steps.pending.outputs.release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          # [skip ci]: the deploy-key push would otherwise re-run ci.yml for a
          # commit that only bumps the version.
          git commit -am "Release $TAG [skip ci]"
          git tag -a "$TAG" -m "Selene $TAG"
          git push --atomic origin HEAD:main "$TAG"

      - name: Create GitHub Release
        if: steps.pending.outputs.release == 'true'
        run: gh release create "$TAG" --title "Selene $TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag

      # The one and only installer build for a release: build.yml has no tag
      # trigger, so it never depends on whether [skip ci] also suppresses the
      # tag push. build.yml attaches the installers to the release.
      - name: Build installers
        if: steps.pending.outputs.release == 'true'
        run: gh workflow run build.yml --ref "$TAG"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting (Prettier)
        run: pnpm format:check

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Type-check (tsc)
        run: pnpm typecheck

      - name: Unit tests (Vitest)
        run: pnpm test

      - name: Production build (tsc + vite)
        run: pnpm build

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Tauri's build script links against the system WebKitGTK/GTK libraries,
      # so the src-tauri crate only compiles on Linux once these are installed.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file

      # tauri-build requires the frontendDist (../dist) to exist to compile.
      # CI only needs the crate to build/test, not a real UI, so a stub is
      # enough; the frontend job above covers the actual production build.
      - name: Create stub frontend dist
        run: |
          mkdir -p dist
          printf '<!doctype html><title>ci</title>' > dist/index.html

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # Cargo workspace root (target/ lives here, not under src-tauri/).
          workspaces: .

      - name: Check formatting (rustfmt)
        run: cargo fmt --all --check

      - name: Lint (Clippy, warnings as errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        # Integration tests are #[ignore]-d (need Docker) and run in
        # integration.yml, so this stays fast and dependency-free.
        run: cargo test --workspace

      # The additional drivers (sqlx sqlite/postgres/mysql + mongodb) are behind
      # off-by-default features, so the default workspace build above does not
      # compile or test them. Lint + test them all together here to guard the
      # drivers and the shared layers on every PR. Their Docker-backed integration
      # tests are #[ignore]-d (run in integration.yml), so without `--ignored` only
      # the unit tests and SQLite's in-process integration tests run — fast and
      # dependency-free.
      - name: Lint additional drivers (Clippy)
        run: cargo clippy -p selene-core --features "sqlite postgres mysql mongodb" --all-targets -- -D warnings

      - name: Tests (additional drivers)
        run: cargo test -p selene-core --features "sqlite postgres mysql mongodb"
