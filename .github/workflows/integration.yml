# Nightly + on demand: runs `just test-integration` (the Docker-backed, #[ignore]d
# driver tests: MSSQL, PostgreSQL, MySQL, MongoDB).
name: Integration tests

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    uses: RobbieMinderhoud/ci-workflows/.github/workflows/integration.yml@v1
    with:
      # keyring's sync-secret-service backend links libdbus.
      apt-packages: "libdbus-1-dev pkg-config"
