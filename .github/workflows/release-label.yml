name: Release label

# Every PR must carry exactly one of patch/minor/major: the release job in
# ci.yml reads it to pick the version bump on merge. Separate from ci.yml so
# adding a label doesn't re-run the full pipeline.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, edited]

permissions: {}

jobs:
  release-label:
    name: Release label
    runs-on: ubuntu-latest
    steps:
      - name: Require exactly one of patch, minor, major
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          count=0
          for label in patch minor major; do
            if [[ ",$LABELS," == *",$label,"* ]]; then
              count=$((count + 1))
            fi
          done
          if [ "$count" -ne 1 ]; then
            echo "::error::Set exactly one release label: patch, minor or major (found: ${LABELS:-none})."
            exit 1
          fi
