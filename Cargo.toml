[workspace]
resolver = "2"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "1.4.19"
edition = "2021"
rust-version = "1.82"
authors = ["Selene contributors"]

[workspace.dependencies]
# Shared across selene-core and the Tauri shell. Concrete driver/export/secret
# crates (tiberius, keyring, csv, rust_xlsxwriter, …) are added in their
# respective implementation phases to keep dependency resolution incremental.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
futures-util = "0.3"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-util = { version = "0.7", features = ["compat"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
uuid = { version = "1" }

[profile.dev]
# Full DWARF debuginfo is the bulk of `target/debug` (it dwarfs the compiled
# code). Line tables keep file:line in panics/backtraces at a fraction of the
# size, with no hit to rebuild speed.
debug = "line-tables-only"

[profile.release]
# ponytail: cargo's defaults (16 codegen units, no cross-crate LTO). Fat LTO +
# codegen-units = 1 shaved ~3.5 MB off the binary but added ~110s to the final,
# single-threaded link on EVERY build (2m18s -> 29s for a one-crate change).
# Not worth it for a desktop app that gets rebuilt many times a day. Re-add
# `lto = true` + `codegen-units = 1` if bundle size ever matters more than
# build time.
strip = true
